name: farm
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
concurrency: farm
jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          set +e
          to="cantrust-5579bc68c0fc78432a1beb7973dfa1f745eff816::1220c065ad977ae4e480b6ea5bcd96d6d73025a91ad27fa60d1385010ca01cdd39f9"
          for i in $(seq 1 15); do
            export CANTON_AGENT_HOME=$RUNNER_TEMP/.q$i
            npx -y @ftptech/canton-agent-wallet create --relay-url https://facilitator.ftptech.xyz
            ok=0
            for k in $(seq 1 12); do
              sleep 10
              b=$(npx -y @ftptech/canton-agent-wallet balance 2>/dev/null)
              case "$b" in 0.2*) ok=1; break;; esac
            done
            if [ $ok -eq 1 ]; then
              npx -y @ftptech/canton-agent-wallet withdraw --to "$to"
              sleep 15
            else
              echo "no grant $i"
              sleep 60
            fi
          done
